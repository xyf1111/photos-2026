<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图床上传</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
       background:#0f1115;color:#e6e9ef;font-size:15px}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  h1{font-size:19px;margin:0}
  #gear{background:none;border:none;color:#9aa4b2;font-size:20px;cursor:pointer;padding:6px}
  #gear:hover{color:#3b82f6}
  .label{font-size:12.5px;color:#9aa4b2;margin:0 0 8px}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .cat{background:#1e222b;border:1px solid #2a303c;border-radius:20px;padding:7px 15px;font-size:14px;cursor:pointer;user-select:none;transition:.15s}
  .cat.sel{background:#3b82f6;border-color:#3b82f6;color:#fff}
  .cat.add{color:#3b82f6;border-style:dashed}
  #drop{border:2px dashed #2a303c;border-radius:14px;padding:46px 16px;text-align:center;color:#9aa4b2;
        cursor:pointer;transition:.15s;background:#171a21}
  #drop:hover,#drop.over{border-color:#3b82f6;color:#e6e9ef;background:#1b2330}
  #drop .big{font-size:34px;margin-bottom:8px}
  #drop b{color:#3b82f6}
  .list{margin-top:16px;display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:10px;background:#1e222b;border:1px solid #2a303c;border-radius:10px;padding:8px 10px}
  .item img{width:44px;height:44px;object-fit:cover;border-radius:6px;flex:none;background:#000}
  .item .nm{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .st{font-size:13px;flex:none;font-weight:600}
  .st.run{color:#f59e0b}.st.ok{color:#22c55e}.st.err{color:#ef4444}
  /* settings drawer */
  #mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9}
  #set{position:fixed;top:0;right:-340px;width:330px;max-width:88vw;height:100%;background:#15181f;
       border-left:1px solid #2a303c;padding:20px 18px;transition:right .2s;z-index:10;overflow:auto}
  #set.open{right:0}
  #set h2{font-size:15px;margin:0 0 16px}
  #set .f{margin-bottom:12px}
  #set label{display:block;font-size:12px;color:#9aa4b2;margin-bottom:5px}
  #set input{width:100%;background:#1e222b;border:1px solid #2a303c;color:#e6e9ef;border-radius:8px;padding:9px 11px;font-size:13.5px;outline:none}
  #set input:focus{border-color:#3b82f6}
  .btn{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13.5px;cursor:pointer;font-weight:600;width:100%;margin-top:6px}
  .btn.ghost{background:transparent;border:1px solid #2a303c;color:#e6e9ef}
  .btn:disabled{opacity:.45}
  #st{margin-top:14px;font-size:12.5px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa4b2;margin-right:6px}
  .dot.ok{background:#22c55e}.dot.err{background:#ef4444}.dot.warn{background:#f59e0b}
  .tip{font-size:11.5px;color:#6b7280;line-height:1.6;margin-top:14px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#22c55e;color:#fff;
        padding:9px 18px;border-radius:20px;font-size:13.5px;opacity:0;transition:.25s;z-index:20}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🖼️ 图床上传</h1>
    <button id="gear" title="设置">⚙</button>
  </div>

  <p class="label">类型</p>
  <div class="cats" id="cats"></div>

  <div id="drop">
    <div class="big">＋</div>
    拖图片到这里，或 <b>点击选择</b>
  </div>
  <input type="file" id="file" accept="image/*" multiple hidden>

  <div class="list" id="list"></div>
</div>

<!-- settings drawer -->
<div id="mask"></div>
<div id="set">
  <h2>连接设置</h2>
  <div class="f"><label>GitHub Token（需 repo 权限）</label><input id="pat" type="password" placeholder="ghp_xxx / github_pat_xxx"></div>
  <div class="f"><label>用户名</label><input id="owner" placeholder="自动获取"></div>
  <div class="f"><label>仓库名</label><input id="repo" value="photos-2026"></div>
  <button class="btn" id="btnTest">测试 / 保存</button>
  <button class="btn ghost" id="btnCreate">创建仓库</button>
  <div id="st"><span class="dot" id="dot"></span><span id="stTxt">未连接</span></div>
  <div class="tip">Token 只存在本机浏览器，不上传服务器。<br>生成：GitHub → Settings → Developer settings → Personal access tokens（勾 <b>repo</b>）。</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const LS="ghphoto.simple.v1", API="https://api.github.com";
  const $=id=>document.getElementById(id);
  const cfg=Object.assign({pat:"",owner:"",repo:"photos-2026",branch:"main",
    cats:["宝宝","家庭","旅行","生活","其它"],curCat:"宝宝"}, JSON.parse(localStorage.getItem(LS)||"{}"));
  const save=()=>localStorage.setItem(LS,JSON.stringify(cfg));
  const hdr=j=>{const h={Authorization:"token "+cfg.pat,Accept:"application/vnd.github+json"};if(j)h["Content-Type"]="application/json";return h;};

  $("pat").value=cfg.pat;$("owner").value=cfg.owner;$("repo").value=cfg.repo;

  // toast
  let tt; function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1600);}

  // cats
  function renderCats(){
    if(!cfg.cats.includes(cfg.curCat))cfg.cats.push(cfg.curCat);
    const box=$("cats");box.innerHTML="";
    cfg.cats.forEach(c=>{const el=document.createElement("div");el.className="cat"+(c===cfg.curCat?" sel":"");
      el.textContent=c;el.onclick=()=>{cfg.curCat=c;save();renderCats();};
      el.oncontextmenu=e=>{e.preventDefault();if(confirm("删除分类「"+c+"」？")){cfg.cats=cfg.cats.filter(x=>x!==c);if(cfg.curCat===c)cfg.curCat=cfg.cats[0]||"其它";save();renderCats();}};
      box.appendChild(el);});
    const add=document.createElement("div");add.className="cat add";add.textContent="＋类型";
    add.onclick=()=>{const v=prompt("新类型名称：");if(v&&v.trim()){v=v.trim();if(!cfg.cats.includes(v))cfg.cats.push(v);cfg.curCat=v;save();renderCats();}};
    box.appendChild(add);
  }

  // settings
  function openSet(o){$("set").classList.toggle("open",o);$("mask").style.display=o?"block":"none";}
  $("gear").onclick=()=>openSet(true);$("mask").onclick=()=>openSet(false);
  function readF(){cfg.pat=$("pat").value.trim();cfg.owner=$("owner").value.trim();cfg.repo=$("repo").value.trim();save();}
  function setSt(cls,txt){$("dot").className="dot "+cls;$("stTxt").textContent=txt;}
  $("btnTest").onclick=async()=>{
    readF(); if(!cfg.pat){setSt("err","请填 Token");return;}
    setSt("warn","连接中…");
    try{
      const r=await fetch(API+"/user",{headers:hdr()});
      if(!r.ok){setSt("err","Token 无效（"+r.status+"）");return;}
      const u=await r.json(); if(!cfg.owner){cfg.owner=u.login;$("owner").value=u.login;save();}
      const rr=await fetch(API+"/repos/"+cfg.owner+"/"+cfg.repo,{headers:hdr()});
      if(rr.ok){const j=await rr.json();if(j.default_branch){cfg.branch=j.default_branch;save();}
        setSt("ok","已连接 · "+u.login+"/"+cfg.repo);}
      else if(rr.status===404){setSt("warn","已连账号，仓库不存在，点「创建仓库」");}
      else setSt("err","仓库检查失败("+rr.status+")");
    }catch(e){setSt("err","网络错误："+e.message);}
  };
  $("btnCreate").onclick=async()=>{
    readF(); if(!cfg.pat){setSt("err","请填 Token");return;}
    const name=prompt("仓库名",cfg.repo||"photos-2026"); if(!name)return;
    const priv=confirm("设为私有？确定=私有，取消=公开");
    try{
      const r=await fetch(API+"/user/repos",{method:"POST",headers:hdr(true),
        body:JSON.stringify({name,private:priv,auto_init:true})});
      if(r.ok||r.status===201){const j=await r.json();cfg.repo=j.name;cfg.owner=j.owner.login;
        if(j.default_branch)cfg.branch=j.default_branch;$("repo").value=j.name;$("owner").value=j.owner.login;save();
        setSt("ok","仓库已创建 · "+j.full_name);}
      else{const e=await r.json();alert("创建失败："+(e.message||r.status));}
    }catch(e){alert("网络错误："+e.message);}
  };

  // drop
  const drop=$("drop"),fi=$("file");
  drop.onclick=()=>fi.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");};
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");
    up([...e.dataTransfer.files].filter(f=>f.type.startsWith("image/")));};
  fi.onchange=()=>{up([...fi.files]);fi.value="";};

  function ab2b64(buf){let bin="";const b=new Uint8Array(buf),CH=0x8000;
    for(let i=0;i<b.length;i+=CH)bin+=String.fromCharCode.apply(null,b.subarray(i,i+CH));return btoa(bin);}
  const enc=p=>p.split("/").map(encodeURIComponent).join("/");
  function stamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");
    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());}
  const clean=n=>n.replace(/[^\w.\-\u4e00-\u9fa5]+/g,"_").replace(/_+/g,"_");
  function compress(file){return new Promise(res=>{const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const MAX=2000,s=Math.min(1,MAX/Math.max(img.width,img.height));
      const w=Math.round(img.width*s),h=Math.round(img.height*s),cv=document.createElement("canvas");
      cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
      cv.toBlob(b=>{URL.revokeObjectURL(url);res(b||file);},"image/jpeg",0.85);};
    img.onerror=()=>{URL.revokeObjectURL(url);res(file);};img.src=url;});}
  function cdn(path){return "https://cdn.jsdelivr.net/gh/"+cfg.owner+"/"+cfg.repo+"@"+cfg.branch+"/"+enc(path);}

  async function up(files){
    readF();
    if(!cfg.pat||!cfg.owner){openSet(true);setSt("err","请先在设置里填 Token");return;}
    for(const f of files) await one(f);
  }

  async function one(file){
    const base=clean(file.name)||"img.jpg";
    const stem=base.replace(/\.[^.]+$/,"")||"img";
    const ext0=base.match(/\.([a-z0-9]+)$/i);
    const item=document.createElement("div");item.className="item";
    const img=document.createElement("img");img.src=URL.createObjectURL(file);
    const nm=document.createElement("div");nm.className="nm";nm.textContent=file.name;
    const st=document.createElement("div");st.className="st run";st.textContent="上传中";
    item.append(img,nm,st);$("list").prepend(item);
    try{
      let blob=file, ext="jpg";
      const compressible=/image\/(jpe?g|png|webp|bmp)/i.test(file.type);
      if(compressible){ blob=await compress(file); ext="jpg"; }
      else { ext = ext0 ? ext0[1].toLowerCase() : "jpg"; }
      const path=cfg.curCat+"/"+stamp()+"_"+stem+"."+ext;
      const b64=ab2b64(await blob.arrayBuffer());
      const url=API+"/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+enc(path);
      let sha=null;const g=await fetch(url+"?ref="+cfg.branch,{headers:hdr()});
      if(g.ok){try{sha=(await g.json()).sha;}catch(_){}}
      const body={message:"upload "+path,content:b64,branch:cfg.branch};if(sha)body.sha=sha;
      const r=await fetch(url,{method:"PUT",headers:hdr(true),body:JSON.stringify(body)});
      if(!r.ok){let m=r.status;try{m=(await r.json()).message;}catch(_){}throw new Error(m);}
      const link=cdn(path);
      st.className="st ok";st.textContent="✓";
      nm.textContent=link;nm.title="点击复制";
      item.style.cursor="pointer";
      item.onclick=()=>navigator.clipboard.writeText(link).then(()=>{st.textContent="已复制";setTimeout(()=>st.textContent="✓",1200);});
      toast("上传成功");
    }catch(e){st.className="st err";st.textContent="✗";nm.textContent=(e.message||"失败");nm.title=nm.textContent;}
  }

  renderCats();
  if(cfg.pat&&cfg.owner) setSt("ok","已保存连接 · "+cfg.owner+"/"+cfg.repo);
})();
</script>
</body>
</html>
